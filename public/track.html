<!DOCTYPE html>
<html lang="en" data-i18n>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="track.title">My tokens · Anareen Lifecare</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="container">
    <div class="tracker">
      <!-- Look up by mobile number -->
      <form class="card card-pad" id="phoneForm" novalidate>
        <h1 style="font-size:1.5rem" data-i18n="track.h1">My tokens</h1>
        <p class="muted" data-i18n="track.lead">Enter the mobile number you gave when booking or at the reception desk. You'll see all your tokens for today, updating live.</p>
        <div class="field">
          <label for="phone" data-i18n="f.phone">Mobile number</label>
          <div class="phone-input"><span>+91</span><input id="phone" type="tel" inputmode="numeric" autocomplete="tel-national" maxlength="14" placeholder="98765 43210" required></div>
        </div>
        <label class="check"><input type="checkbox" id="remember" checked> <span data-i18n="track.remember">Remember this number on this device</span></label>
        <button class="btn btn-block btn-lg" type="submit" id="lookupBtn" data-i18n="home.trackBtn">Show my tokens</button>
        <p class="form-error" id="err" role="alert"></p>
        <details class="alt-track">
          <summary data-i18n="track.byToken">No mobile number on your token? Track by token number</summary>
          <div class="field" style="margin-top:12px">
            <label for="doctor" data-i18n="f.doctor">Doctor</label>
            <select id="doctor"><option data-i18n="loading">Loading…</option></select>
          </div>
          <div class="field">
            <label for="token" data-i18n="track.tokenNo">Token number</label>
            <input id="token" type="number" min="1" max="9999" inputmode="numeric" placeholder="e.g. 14" data-i18n-placeholder="track.tokenPh">
          </div>
          <button class="btn btn-ghost btn-block" type="button" id="tokenBtn" data-i18n="track.trackBtn">Track this token</button>
        </details>
      </form>

      <!-- Results -->
      <div id="results" class="hidden">
        <div class="results-head">
          <div>
            <div class="muted small" id="forWho"></div>
            <span class="live-dot offline" data-i18n="live.connecting">Connecting…</span>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn btn-ghost btn-sm" id="notifyBtn" type="button" data-i18n="track.alertBtn">🔔 Alert me when I'm next</button>
            <button class="btn btn-ghost btn-sm" id="changeBtn" type="button" data-i18n="track.change">Change number</button>
          </div>
        </div>
        <div id="tickets"></div>
      </div>
    </div>
  </main>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/track.js"></script>
</body>
</html>
